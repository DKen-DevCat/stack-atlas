<!doctype html>
<html lang="ja">
<!-- ライブの試しのビューア。左の枠に本物のアプリ（ここではサンプル）、右に挙動の一覧と経路。
     アプリの枠の中で起きたこと（押した部品・通信・画面の変化）は、道具が入れたスクリプト（../inject.js）が
     postMessage で知らせてくる。ビューアは、アプリの枠の中を直接は見ない・触らない。
     見せ方: 操作を「記録」してから、「再生」する。実際の通信は速すぎて目で追えないので、見せる速さを実際の速さから切り離す。
     再生では、どの段に実際どれだけ時間がかかったか（時間の内訳）を、段ごとに出す。 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack Atlas ライブの試し</title>
<style>
:root {
  --bg: #f2f4f7; --surface: #ffffff; --surface-2: #e8ecf1; --line: #d2d8e1; --fg: #18202b; --muted: #5b6778;
  --go: #2160e8; --go-soft: #dce7ff; --back: #b9530b; --back-soft: #ffe7d3; --ok: #0b7f62; --ng: #b3261e;
  --k-part: #6f45cf; --k-api: #9a6708; --k-store: #a73a37;
  --font: "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1319; --surface: #171d26; --surface-2: #202835; --line: #2d3746; --fg: #e7ecf3; --muted: #95a2b5;
    --go: #74a6ff; --go-soft: #1b2b4d; --back: #f2a467; --back-soft: #3e2a19; --ok: #5fd0b0; --ng: #ff8a80;
    --k-part: #b49bf5; --k-api: #e2b65a; --k-store: #f09a96;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; padding: 14px 16px 28px; background: var(--bg); color: var(--fg); font: 14px/1.6 var(--font); }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible { outline: 2px solid var(--go); outline-offset: 2px; }
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.top h1 { margin: 0; font-size: 18px; font-weight: 600; }
.top p { margin: 0; color: var(--muted); }
.badge { border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; font-size: 12px; color: var(--muted); background: var(--surface); }
.stage { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(340px, 1fr); gap: 14px; align-items: start; }
@media (max-width: 760px) { .stage { grid-template-columns: minmax(0, 1fr); } }

.shot { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
.chrome { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); font-size: 12px; color: var(--muted); }
.chrome .url { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 1px 12px; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frame { position: relative; height: 560px; }
.frame iframe { display: block; width: 100%; height: 100%; border: 0; background: #ffffff; }
.overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.overlay .box { position: absolute; border-radius: 6px; opacity: 0; }
.overlay .box.part { border: 3px solid var(--go); box-shadow: 0 0 0 6px color-mix(in srgb, var(--go) 22%, transparent); }
.overlay .box.dom { border: 3px solid var(--back); background: color-mix(in srgb, var(--back) 18%, transparent); }
@keyframes show-box { 0% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
.overlay .box.on { animation: show-box 1.8s ease-out 1; }

.flow { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.cap { margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.08em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 11px; font-size: 13px; }
.chips button[aria-pressed="true"] { background: var(--go); border-color: var(--go); color: var(--surface); font-weight: 600; }
.flow-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.flow-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
.tag { font-size: 12px; border-radius: 4px; padding: 0 7px; background: var(--surface-2); color: var(--muted); }
.tag.live { background: var(--go-soft); color: var(--go); }
.tag.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.tag.ng { background: color-mix(in srgb, var(--ng) 16%, transparent); color: var(--ng); }

/* 再生の操作: 再生・一時停止、再生バー（段の長さがそのまま時間の内訳）、見せる速さ。文字は出さない */
.player { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.pbtn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.pbtn:hover { background: var(--surface-2); }
.pbtn svg { width: 14px; height: 14px; fill: var(--fg); }
.pbtn .i-pause { display: none; }
.pbtn.playing .i-play { display: none; }
.pbtn.playing .i-pause { display: block; }
.seek { position: relative; height: 26px; }
.segs { position: absolute; inset: 8px 0; display: flex; gap: 2px; border-radius: 5px; overflow: hidden; }
.segs i { display: block; min-width: 2px; background: var(--muted); opacity: 0.4; }
.segs i.req { background: var(--go); }
.segs i.dom { background: var(--ok); }
.segs i.max { background: var(--back); }
.segs i.past, .segs i.now { opacity: 1; }
input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; margin: 0; cursor: pointer; }
input[type="range"]:focus-visible { outline: 2px solid var(--go); outline-offset: 2px; border-radius: 4px; }
#p-seek { position: absolute; inset: 0; width: 100%; height: 100%; }
#p-seek::-webkit-slider-runnable-track { background: transparent; height: 26px; }
#p-seek::-webkit-slider-thumb { -webkit-appearance: none; width: 4px; height: 26px; border-radius: 2px; background: var(--fg); box-shadow: 0 0 0 2px var(--surface); }
.speed { display: flex; align-items: center; gap: 6px; }
.speed svg { height: 11px; fill: var(--muted); flex: none; }
#p-speed { width: 110px; height: 26px; }
#p-speed::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--line); }
#p-speed::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--fg); box-shadow: 0 0 0 2px var(--surface); }

.path { display: flex; flex-direction: column; min-width: 0; }
.pnode { border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px 6px; display: flex; flex-direction: column; opacity: 0.5; transition: opacity 0.2s, border-color 0.2s, box-shadow 0.2s; }
.pnode .kind { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; }
.pnode .nm { font-family: var(--mono); font-size: 12.5px; font-weight: 500; overflow-wrap: anywhere; }
.pnode .src, .pnode .nt { font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.pnode .src { font-family: var(--mono); }
.pnode[data-k="part"] .kind { color: var(--k-part); } .pnode[data-k="api"] .kind { color: var(--k-api); } .pnode[data-k="store"] .kind { color: var(--k-store); }
.pnode.lit { opacity: 1; border-color: var(--go); box-shadow: 0 0 0 3px var(--go-soft); }
.pnode.lit.drawn { border-style: dashed; box-shadow: none; }
@keyframes waiting { 0%, 100% { box-shadow: 0 0 0 3px var(--go-soft); } 50% { box-shadow: 0 0 0 7px var(--go-soft); } }
.pnode.wait { animation: waiting 0.9s ease-in-out infinite; }
.hop { display: grid; grid-template-columns: 26px minmax(0, 1fr); column-gap: 8px; min-height: 40px; margin-left: 12px; padding: 3px 0; }
.rails { display: flex; justify-content: center; gap: 10px; }
.rail { position: relative; width: 0; border-left: 2px solid var(--line); }
.hop.drawn .rail { border-left-style: dashed; }
.rail::after { content: ""; position: absolute; left: -6px; border: 5px solid transparent; }
.rail.go::after { bottom: -1px; border-top-color: var(--line); border-bottom-width: 0; }
.rail.back::after { top: -1px; border-bottom-color: var(--line); border-top-width: 0; }
.lbs { display: flex; flex-direction: column; justify-content: center; font-size: 12px; line-height: 1.4; min-width: 0; }
.lb { color: var(--muted); opacity: 0.65; overflow-wrap: anywhere; }
.hop.go-on .rail.go { border-left-color: var(--go); } .hop.go-on .rail.go::after { border-top-color: var(--go); } .hop.go-on .lb.go { color: var(--go); opacity: 1; }
.hop.back-on .rail.back { border-left-color: var(--back); } .hop.back-on .rail.back::after { border-bottom-color: var(--back); } .hop.back-on .lb.back { color: var(--back); opacity: 1; }
.how { font-size: 11px; color: var(--muted); }
.key { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); }
.key i { display: inline-block; width: 22px; vertical-align: middle; margin-right: 5px; border-top: 2px solid var(--muted); }
.key .d i { border-top-style: dashed; }

/* 時間の内訳 */
.sec { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.sec h3 { margin: 0; font-size: 13px; font-weight: 600; }
.times { display: flex; flex-direction: column; gap: 4px; }
.trow { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(60px, 1fr) 64px; gap: 8px; align-items: center; font-size: 12.5px; padding: 1px 4px; border-radius: 4px; }
.trow .lbl { overflow-wrap: anywhere; color: var(--muted); }
.trow .bar { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.trow .bar i { display: block; height: 100%; width: 0; background: var(--go); border-radius: 5px; }
.trow .ms { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.trow.done .lbl, .trow.now .lbl { color: var(--fg); }
.trow.now { background: var(--go-soft); }
.trow.max .ms { color: var(--back); font-weight: 600; }
.trow.dom .bar i { background: var(--ok); }
.trow.gap .bar i { background: var(--muted); }
.trow.max .bar i { background: var(--back); }
.total { font-size: 12.5px; color: var(--muted); }
.row { display: flex; flex-direction: column; gap: 2px; }
.row .line { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: baseline; font-family: var(--mono); font-size: 12.5px; }
pre { margin: 0; padding: 6px 8px; background: var(--surface-2); border-radius: 6px; font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 132px; overflow: auto; }
.small { font-size: 11px; color: var(--muted); }
.changes { margin: 0; padding-left: 18px; font-size: 13px; }
.changes .added { color: var(--back); } .changes .removed { color: var(--muted); text-decoration: line-through; }
.empty { color: var(--muted); font-size: 13px; }
details summary { cursor: pointer; font-size: 13px; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .pnode.wait { animation: none; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>Stack Atlas — ライブの試し</h1>
    <span class="badge">試し</span>
    <p>左のアプリを、ふつうに操作してください。操作を記録して、右で再生します。</p>
  </header>

  <div class="stage">
    <section class="shot" aria-label="本物のアプリ">
      <div class="chrome"><span>本物のアプリ</span><span class="url" id="url"></span></div>
      <div class="frame">
        <iframe id="app" title="アプリ"></iframe>
        <div class="overlay" id="overlay"></div>
      </div>
    </section>

    <section class="flow" aria-label="挙動と経路">
      <h2 class="cap">この画面の挙動</h2>
      <div class="chips" id="behaviors"></div>
      <div class="flow-head" aria-live="polite">
        <h2 id="f-name">操作を待っています</h2>
        <span class="tag" id="f-state" hidden></span>
        <span class="tag" id="f-verdict" hidden></span>
      </div>

      <div class="player" id="player" hidden>
        <button class="pbtn" id="p-play" type="button" aria-label="再生・一時停止" title="再生・一時停止">
          <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>
        </button>
        <div class="seek">
          <div class="segs" id="p-segs"></div>
          <input id="p-seek" type="range" min="0" max="1" step="any" value="0" aria-label="再生位置" title="再生位置">
        </div>
        <div class="speed" title="見せる速さ（左が 0.1 倍、右が 1 倍）">
          <svg viewBox="0 0 8 12" aria-hidden="true"><path d="M1 1l6 5-6 5z"/></svg>
          <input id="p-speed" type="range" min="0.1" max="1" step="0.1" value="0.2" aria-label="見せる速さ（0.1 倍から 1 倍）">
          <svg viewBox="0 0 22 12" aria-hidden="true"><path d="M1 1l6 5-6 5zM8 1l6 5-6 5zM15 1l6 5-6 5z"/></svg>
        </div>
      </div>

      <div class="path" id="path"></div>
      <div class="key">
        <span class="s"><i></i>実際に見えたもの（ブラウザから出た通信まで）</span>
        <span class="d"><i></i>図に書かれているもの（その先は、見えない）</span>
      </div>

      <div class="sec">
        <h3>時間の内訳（実際にかかった時間）</h3>
        <div id="s-times"><div class="empty">操作すると、ここに出ます。</div></div>
      </div>
      <div class="sec">
        <h3>画面に反映されたもの</h3>
        <div id="s-dom"><div class="empty">まだありません。</div></div>
      </div>
      <details class="sec">
        <summary>実際の通信の中身</summary>
        <div id="s-reqs"><div class="empty">まだありません。</div></div>
      </details>
    </section>
  </div>
</div>

<script>
(async () => {
  const KIND = { part: '画面の部品', api: '受け口', store: 'データの置き場' };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const NOT_TOOL_WINDOW = 'この画面は、道具が開いた窓の中でだけ動きます。`node prototype/live/run.mjs` を実行すると、別のブラウザの窓が開きます。その窓で操作してください。';
  const appUrl = new URLSearchParams(location.search).get('app');
  if (!appUrl) { $('f-name').textContent = NOT_TOOL_WINDOW; return; }
  const appOrigin = new URL(appUrl).origin;
  const data = await (await fetch('../data.json')).json();
  const frame = $('app');
  $('url').textContent = appUrl;
  window.__seen = [];        // 受け取った知らせ（確かめ用）
  window.__ops = [];         // 操作ごとの記録（確かめ用）
  window.__replayed = 0;     // 再生が最後まで行った回数（確かめ用）

  let rec = null;            // 記録中の操作
  let cur = null;            // 再生している操作
  let shown = null;          // 経路を出している挙動の id
  // 再生は、実際の時間の軸の上を進む。pos は操作の始まりからのミリ秒、speed は実際の何倍か（0.1〜1）
  const play = { pos: 0, speed: 0.2, running: false, raf: 0, last: 0, shownEnd: false };
  window.__player = () => ({ pos: play.pos, speed: play.speed, running: play.running, total: cur ? cur.total : 0, k: cur ? locate(cur, play.pos).k : -1, done: !!cur && play.pos >= cur.total });

  const fmt = (ms) => (ms >= 100 ? Math.round(ms) : ms >= 10 ? ms.toFixed(1) : ms.toFixed(2)) + ' ms';
  const pretty = (text) => {
    if (text == null || text === '') return '（本文なし）';
    try { return JSON.stringify(JSON.parse(text), null, 2); } catch { return String(text); }
  };
  const matches = (expect, req) => {
    const re = new RegExp('^' + expect.path.replace(/[.*+?^$()|[\]\\]/g, '\\$&').replace(/\{[^}]+\}/g, '[^/]+') + '(\\?.*)?$');
    return expect.method === req.method && re.test(req.path);
  };
  // アプリが一覧を丸ごと描き直すと、全部が「消えて、増えた」に見える。同じ中身の「消えた」と「増えた」は打ち消して、差だけを残す
  function net(changes) {
    const removed = changes.filter((c) => c.kind === 'removed').map((c) => c.text);
    const out = [];
    for (const c of changes) {
      if (c.kind !== 'added') continue;
      const i = removed.indexOf(c.text);
      if (i >= 0) removed.splice(i, 1);
      else out.push(c);
    }
    return out.concat(removed.map((text) => ({ kind: 'removed', text })));
  }
  window.__net = net;

  /* ---- 経路 ---- */
  function renderChips() {
    $('behaviors').innerHTML = data.behaviors.map((b) =>
      '<button type="button" data-b="' + b.id + '" aria-pressed="' + (shown === b.id) + '">' + esc(b.name) + '</button>').join('');
  }
  function renderPath(b) {
    let html = '';
    b.nodes.forEach((n, c) => {
      html += '<div class="pnode" data-k="' + n.k + '" data-c="' + c + '"><span class="kind">' + KIND[n.k] + '</span><span class="nm">' + esc(n.n) +
        '</span><span class="src">' + esc(n.src) + '</span>' + (n.nt ? '<span class="nt">' + esc(n.nt) + '</span>' : '') + '</div>';
      if (c < b.nodes.length - 1) {
        html += '<div class="hop' + (c === 0 ? '' : ' drawn') + '" data-c="' + c + '"><div class="rails"><span class="rail go"></span><span class="rail back"></span></div>' +
          '<div class="lbs"><span class="lb go">↓ ' + esc(b.go[c]) + '</span><span class="lb back">↑ ' + esc(b.back[c]) + '</span>' +
          '<span class="how">' + (c === 0 ? '実際に見える段' : '図に書かれているだけの段') + '</span></div></div>';
      }
    });
    $('path').innerHTML = html;
  }
  const node = (c) => $('path').querySelector('.pnode[data-c="' + c + '"]');
  const hop = (c) => $('path').querySelector('.hop[data-c="' + c + '"]');
  function setHead(b, text, cls) {
    shown = b.id;
    renderChips();
    $('f-name').textContent = b.name;
    const st = $('f-state');
    st.hidden = false; st.className = 'tag ' + cls; st.textContent = text;
  }
  function box(kind, rect) {
    if (!rect || rect.w < 2 || rect.h < 2) return;
    const el = document.createElement('div');
    el.className = 'box ' + kind;
    Object.assign(el.style, { left: rect.x + 'px', top: rect.y + 'px', width: rect.w + 'px', height: rect.h + 'px' });
    $('overlay').append(el);
    void el.offsetWidth;
    el.classList.add('on');
    setTimeout(() => el.remove(), 2000);
  }

  /* ---- 記録 ---- */
  function begin(b, ev) {
    stopTimer();
    rec = { behavior: b.id, startedAt: ev.at, rect: ev.rect || null, reqs: new Map(), changes: [], domAt: null, verdict: null, steps: null, quiet: null };
    window.__ops.push(rec);
    cur = null;
    $('overlay').replaceChildren();   // 前の操作の枠を残さない
    setHead(b, '記録中…', 'live');
    renderPath(b);
    node(0).classList.add('lit');
    $('f-verdict').hidden = true;
    $('player').hidden = true;
    $('s-times').innerHTML = '<div class="empty">記録しています…</div>';
    $('s-dom').innerHTML = $('s-reqs').innerHTML = '<div class="empty">記録しています…</div>';
    if (ev.rect) box('part', ev.rect);
  }
  function onEvent(ev) {
    window.__seen.push(ev);
    if (ev.t === 'open') { const b = data.behaviors.find((x) => x.trigger.how === 'open'); if (b) begin(b, ev); return; }
    if (ev.t === 'part') {
      const b = data.behaviors.find((x) => x.trigger.part === ev.part && x.trigger.how === ev.how);
      if (b) begin(b, ev);
      return;
    }
    if (!rec || rec.steps) return;   // どの操作にも結べない知らせ（記録が済んだあとの通信など）は、出さない
    const b = data.behaviors.find((x) => x.id === rec.behavior);
    if (ev.t === 'req') {
      rec.reqs.set(ev.id, { id: ev.id, method: ev.method, path: ev.path, body: ev.body, sentAt: ev.at, resAt: null, status: null, resBody: null });
      if (rec.verdict == null) rec.verdict = matches(b.expect, ev);
    } else if (ev.t === 'res') {
      const r = rec.reqs.get(ev.id);
      if (r) { r.resAt = ev.at; r.status = ev.status; r.resBody = ev.body; }
    } else if (ev.t === 'dom') {
      rec.changes.push(...ev.changes);
      rec.domAt = ev.at;
    }
    clearTimeout(rec.quiet);
    const o = rec;
    rec.quiet = setTimeout(() => settle(o), 500);   // しばらく何も起きなければ、操作が済んだとみなす
  }

  /** 記録を、段の列にする: 押してから送るまで → 送ってから返るまで →（次の通信…）→ 返ってから画面に反映されるまで */
  function settle(o) {
    if (o !== rec) return;
    const reqs = [...o.reqs.values()].sort((a, b) => a.sentAt - b.sentAt);
    if (reqs.some((r) => r.resAt == null)) { o.quiet = setTimeout(() => settle(o), 300); return; }   // 返事を待っている
    const steps = [];
    let prev = o.startedAt;
    reqs.forEach((r, i) => {
      steps.push({ kind: 'gap', label: i === 0 ? '押してから、通信を送るまで' : '返ってから、次の通信を送るまで', ms: Math.max(0, r.sentAt - prev) });
      steps.push({ kind: 'req', main: i === 0, req: r, label: r.method + ' ' + r.path + ' を送ってから、返るまで', ms: Math.max(0, r.resAt - r.sentAt) });
      prev = r.resAt;
    });
    if (o.domAt != null) steps.push({ kind: 'dom', label: '返ってから、画面に反映されるまで', ms: Math.max(0, o.domAt - prev) });
    o.steps = steps;
    o.total = steps.reduce((a, s) => a + s.ms, 0);
    o.net = net(o.changes);
    cur = o;
    const b = data.behaviors.find((x) => x.id === o.behavior);
    setHead(b, '記録した操作を再生', 'live');
    const v = $('f-verdict');
    if (o.verdict != null) {
      v.hidden = false;
      v.className = 'tag ' + (o.verdict ? 'ok' : 'ng');
      v.textContent = o.verdict ? '図と合っている' : '図と違う（図: ' + b.expect.method + ' ' + b.expect.path + '）';
    }
    renderTimes();
    renderSeen();
    renderSegs();
    $('player').hidden = !(o.total > 0);
    if (o.total > 0) start(0);
  }

  /* ---- 時間の内訳と、記録の中身 ---- */
  function renderTimes() {
    const o = cur;
    if (!o || !o.steps.length) { $('s-times').innerHTML = '<div class="empty">通信はありませんでした。</div>'; return; }
    const max = Math.max(...o.steps.map((s) => s.ms));
    $('s-times').innerHTML = '<div class="times">' + o.steps.map((s, i) =>
      '<div class="trow ' + s.kind + (s.ms === max && max > 0 ? ' max' : '') + '" data-i="' + i + '"><span class="lbl">' + esc(s.label) + '</span>' +
      '<span class="bar"><i data-w="' + (max > 0 ? Math.max(2, (s.ms / max) * 100) : 2).toFixed(1) + '"></i></span><span class="ms">' + fmt(s.ms) + '</span></div>').join('') +
      '</div><div class="total">合わせて ' + fmt(o.total) + '。色の違う行が、いちばん長くかかった段です。</div>';
  }
  function renderSeen() {
    const o = cur;
    const reqs = o ? [...o.reqs.values()].sort((a, b) => a.sentAt - b.sentAt) : [];
    $('s-reqs').innerHTML = reqs.length ? reqs.map((r) =>
      '<div class="row"><div class="line"><b>' + esc(r.method) + '</b><span>' + esc(r.path) + '</span><span>→ ' + esc(r.status) + '</span><span>' + fmt(r.resAt - r.sentAt) + '</span></div>' +
      '<span class="small">送った中身</span><pre>' + esc(pretty(r.body)) + '</pre><span class="small">返ってきた中身</span><pre>' + esc(pretty(r.resBody)) + '</pre></div>').join('')
      : '<div class="empty">通信はありませんでした。</div>';
    const ch = o ? o.net : [];
    $('s-dom').innerHTML = ch.length ? '<ul class="changes">' + ch.map((c) =>
      '<li class="' + c.kind + '">' + (c.kind === 'added' ? '＋ 増えた: ' : '－ 消えた: ') + esc(c.text || '（文字なし）') + '</li>').join('') + '</ul>'
      : '<div class="empty">画面は変わりませんでした。</div>';
  }

  /* ---- 再生 ---- */
  // 再生バーの段。幅は実際の時間に比例するので、バーそのものが時間の内訳になる
  function renderSegs() {
    const o = cur;
    const max = Math.max(...o.steps.map((s) => s.ms));
    $('p-segs').innerHTML = o.steps.map((s, i) =>
      '<i class="' + s.kind + (s.ms === max && max > 0 ? ' max' : '') + '" data-i="' + i + '" style="flex: ' + Math.max(s.ms, 0.0001) + ' 1 0" title="' + esc(s.label + '（' + fmt(s.ms) + '）') + '"></i>').join('');
    $('p-seek').max = String(o.total);
  }
  // pos のとき、どの段の、どこまで進んでいるか
  function locate(o, pos) {
    let acc = 0;
    for (let i = 0; i < o.steps.length; i++) {
      const ms = o.steps[i].ms;
      if (pos < acc + ms || i === o.steps.length - 1) return { k: i, p: ms > 0 ? Math.max(0, Math.min(1, (pos - acc) / ms)) : 1 };
      acc += ms;
    }
    return { k: 0, p: 0 };
  }
  // いまの pos の姿を描く
  function paint() {
    const o = cur;
    if (!o) return;
    const done = play.pos >= o.total;
    const { k, p } = locate(o, play.pos);
    const main = o.steps.findIndex((s) => s.kind === 'req' && s.main);
    const path = $('path');
    path.querySelectorAll('.pnode, .hop').forEach((el) => el.classList.remove('lit', 'drawn', 'wait', 'go-on', 'back-on'));
    path.querySelectorAll('.hop').forEach((h, i) => { if (i > 0) h.classList.add('drawn'); });
    node(0).classList.add('lit');
    if (main >= 0 && k >= main) {            // 通信を送った
      hop(0).classList.add('go-on'); node(1).classList.add('lit');
      if (hop(1)) { hop(1).classList.add('go-on'); node(2).classList.add('lit', 'drawn'); }
      if (k === main && !done) node(1).classList.add('wait');   // 返事を待っている
    }
    if (main >= 0 && (k > main || done)) {   // 返事が返った
      if (hop(1)) hop(1).classList.add('back-on');
      hop(0).classList.add('back-on');
    }
    document.querySelectorAll('.trow').forEach((row, i) => {
      const bar = row.querySelector('.bar i');
      const past = done || i < k;
      row.classList.toggle('done', past);
      row.classList.toggle('now', !done && i === k);
      bar.style.width = (past ? 1 : i === k ? p : 0) * Number(bar.dataset.w) + '%';
    });
    $('p-segs').querySelectorAll('i').forEach((el, i) => {
      el.classList.toggle('past', done || i < k);
      el.classList.toggle('now', !done && i === k);
    });
    $('p-seek').value = String(play.pos);
    $('p-play').classList.toggle('playing', play.running);
    if (done && !play.shownEnd) {            // 最後まで来たら、画面で変わった所を左に出す
      play.shownEnd = true;
      o.net.filter((c) => c.kind === 'added').slice(0, 3).forEach((c) => box('dom', c.rect));
    }
    if (!done) play.shownEnd = false;
  }
  function stopTimer() { cancelAnimationFrame(play.raf); play.running = false; $('p-play').classList.remove('playing'); }
  function tick(ts) {
    if (!play.running || !cur) return;
    play.pos = Math.min(cur.total, play.pos + Math.max(0, ts - play.last) * play.speed);
    play.last = ts;
    if (play.pos >= cur.total) { play.running = false; paint(); window.__replayed++; return; }
    paint();
    play.raf = requestAnimationFrame(tick);
  }
  function start(pos) {
    if (!cur || !(cur.total > 0)) return;
    stopTimer();
    play.pos = pos >= cur.total ? 0 : pos;   // 最後で押したら、最初から
    if (play.pos === 0 && cur.rect) box('part', cur.rect);
    play.running = true;
    play.last = performance.now();
    paint();
    play.raf = requestAnimationFrame(tick);
  }
  $('p-play').addEventListener('click', () => { if (play.running) { stopTimer(); paint(); } else start(play.pos); });
  $('p-seek').addEventListener('input', (e) => { if (!cur) return; play.pos = Number(e.target.value); play.last = performance.now(); paint(); });
  $('p-speed').addEventListener('input', (e) => { play.speed = Number(e.target.value); });

  /* ---- 受け取る ---- */
  window.addEventListener('message', (e) => {
    if (e.origin !== appOrigin || e.source !== frame.contentWindow) return;   // アプリの枠からの知らせだけを受ける
    if (!e.data || e.data.__atlasLive !== 1) return;
    onEvent(e.data);
  });
  $('behaviors').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-b]');
    if (!btn) return;
    stopTimer(); rec = null; cur = null;
    const b = data.behaviors.find((x) => x.id === btn.dataset.b);
    setHead(b, '図（操作はしていない）', '');
    renderPath(b);
    $('path').querySelectorAll('.pnode').forEach((n, i) => { n.classList.add('lit'); if (i > 1) n.classList.add('drawn'); });
    $('path').querySelectorAll('.hop').forEach((h) => h.classList.add('go-on', 'back-on'));
    $('f-verdict').hidden = true; $('player').hidden = true;
    $('s-times').innerHTML = '<div class="empty">操作すると、ここに出ます。</div>';
    $('s-dom').innerHTML = $('s-reqs').innerHTML = '<div class="empty">まだありません。</div>';
  });

  renderChips();
  frame.src = appUrl;
  // 道具が開いた窓なら、アプリの枠から「開いた」の知らせがすぐ来る。来なければ、ふだんのブラウザで開かれている
  setTimeout(() => { if (!window.__seen.length) $('f-name').textContent = NOT_TOOL_WINDOW; }, 4000);
})();
</script>
</html>
