# 画面の側（app/index.html）の箱と、そこから出る線。
nodes:
  - id: "screen:/"
    kind: screen
    name: "記事とコメント（A map is not the territory）"
    runtime: browser
    file: app/index.html
    line: 1
    evidence: [{ file: app/index.html, lines: [1, 112], text: "<title>A map is not the territory</title>" }]
    meta: { path: "/" }
    ports:
      - id: out
        dir: out
        items:
          - { id: open, name: "開く", type: void }

  - id: "fn:load"
    kind: fn
    name: "load（コメントを読みこんで描く。render を含む）"
    runtime: browser
    file: app/index.html
    line: 78
    evidence:
      - { file: app/index.html, lines: [78, 81], text: "async function load() {" }
      - { file: app/index.html, lines: [51, 76], text: "function render(comments) {" }
    ports:
      - id: in
        dir: in
        items:
          - { id: call, name: "呼ぶ", type: void }
          - id: comments
            name: comments
            type: "object[]"
            children:
              - { id: id, name: id, type: number }
              - { id: body, name: body, type: string }
              - { id: author, name: author, type: string }
      - id: out
        dir: out
        items:
          - { id: request, name: "GET /api/comments を呼ぶ", type: void }
          - id: comments
            name: comments
            type: "object[]"
            children:
              - { id: id, name: id, type: number }
              - { id: body, name: body, type: string }
              - { id: author, name: author, type: string }
          - { id: count, name: "comments.length", type: number }
    links:
      - { from: in/call, to: out/request }
      - { from: in/comments, to: out/comments }
      - { from: in/comments, to: out/count }

  - id: "part:status"
    kind: component
    name: "件数の表示"
    runtime: browser
    file: app/index.html
    line: 37
    evidence: [{ file: app/index.html, lines: [37, 37], text: "<div id=\"status\">読みこみ中…</div>" }]
    ports:
      - id: in
        dir: in
        items:
          - { id: count, name: "件数", type: number }

  - id: "part:comment-list"
    kind: component
    name: "コメントの一覧"
    runtime: browser
    file: app/index.html
    line: 38
    evidence: [{ file: app/index.html, lines: [38, 38], text: "<ul id=\"comments\"></ul>" }]
    ports:
      - id: in
        dir: in
        items:
          - id: comments
            name: comments
            type: "object[]"
            children:
              - { id: id, name: id, type: number }
              - { id: body, name: body, type: string }
              - { id: author, name: author, type: string }

  - id: "part:comment-form"
    kind: component
    name: "コメントを書く欄"
    runtime: browser
    file: app/index.html
    line: 33
    evidence:
      - { file: app/index.html, lines: [33, 36], text: "<form id=\"comment-form\">" }
      - { file: app/index.html, lines: [83, 94], text: "form.addEventListener('submit'" }
    ports:
      - id: out
        dir: out
        items:
          - id: comment
            name: comment
            type: object
            children:
              - { id: body, name: body, type: string }
          - { id: reload, name: "読み直す", type: void }
      - id: in
        dir: in
        items:
          - { id: saved, name: "comment（返事。使わずに捨てる）", type: object }

  - id: "part:delete-button"
    kind: component
    name: "コメントの削除のボタン"
    runtime: browser
    file: app/index.html
    line: 66
    evidence:
      - { file: app/index.html, lines: [66, 71], text: "del.className = 'del';" }
      - { file: app/index.html, lines: [96, 101], text: "e.target.closest('button.del')" }
    variants: [{ id: mine, name: "自分のコメント（author が me）" }]
    ports:
      - id: out
        dir: out
        items:
          - { id: id, name: "dataset.id", type: string }
          - { id: reload, name: "読み直す", type: void }
      - id: in
        dir: in
        items:
          - { id: done, name: "204（中身なし）", type: void }

wires:
  # 開いたとき
  - { from: "screen:/#out/open", to: "fn:load#in/call", via: call, evidence: [{ file: app/index.html, lines: [104, 109], text: "navigator.serviceWorker.register('sw.js')" }] }
  - { from: "fn:load#out/request", to: "endpoint:GET /api/comments#in/request", via: http, evidence: [{ file: app/index.html, lines: [79, 79], text: "await api('/comments');" }] }
  - { from: "fn:load#out/count", to: "part:status#in/count", via: render, evidence: [{ file: app/index.html, lines: [52, 52], text: "status.textContent = comments.length + ' 件のコメント';" }] }
  - { from: "fn:load#out/comments", to: "part:comment-list#in/comments", via: render, evidence: [{ file: app/index.html, lines: [53, 53], text: "list.replaceChildren(...comments.map(" }] }
  # コメントを送る
  - { from: "part:comment-form#out/comment", to: "endpoint:POST /api/comments#in/body.comment", via: http, evidence: [{ file: app/index.html, lines: [87, 91], text: "body: JSON.stringify({ comment: { body } })" }] }
  - { from: "part:comment-form#out/reload", to: "fn:load#in/call", via: call, evidence: [{ file: app/index.html, lines: [92, 93], text: "form.comment.value = '';" }] }
  # コメントを消す
  - { from: "part:delete-button#out/id", to: "endpoint:DELETE /api/comments/{id}#in/path.id", via: http, evidence: [{ file: app/index.html, lines: [99, 99], text: "api('/comments/' + del.dataset.id" }] }
  - { from: "part:delete-button#out/reload", to: "fn:load#in/call", via: call, evidence: [{ file: app/index.html, lines: [98, 100], text: "if (!del) return;" }] }
