# 受け口の側（app/sw.js。Service Worker が /api/* の通信を受けて返事を作る）の箱と、そこから出る線。
# Service Worker は利用者の端末の中で動くが、通信を受けて返事を作る役なので runtime: server と書く（§4.1）。
nodes:
  - id: "endpoint:GET /api/comments"
    kind: endpoint
    name: "GET /api/comments（Service Worker）"
    runtime: server
    file: app/sw.js
    line: 28
    evidence: [{ file: app/sw.js, lines: [28, 30], text: "url.pathname === '/api/comments' && req.method === 'GET'" }]
    meta: { route: "GET /api/comments" }
    ports:
      - { id: in, dir: in, items: [{ id: request, name: "入力なし", type: void }] }
      - { id: req, dir: out, items: [{ id: all, name: "全部を読む", type: void }] }
      - id: res
        dir: in
        items:
          - id: rows
            name: comments
            type: "object[]"
            children:
              - { id: id, name: id, type: number }
              - { id: body, name: body, type: string }
              - { id: author, name: author, type: string }
      - id: out
        dir: out
        items:
          - id: body
            name: body
            type: object
            children:
              - id: comments
                name: comments
                type: "object[]"
                children:
                  - { id: id, name: id, type: number }
                  - { id: body, name: body, type: string }
                  - { id: author, name: author, type: string }

