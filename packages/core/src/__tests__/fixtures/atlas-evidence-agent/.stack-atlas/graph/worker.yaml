                  - { id: author, name: author, type: string }

  - id: "endpoint:DELETE /api/comments/{id}"
    kind: endpoint
    name: "DELETE /api/comments/{id}（Service Worker）"
    runtime: server
    file: app/sw.js
    line: 37
    evidence: [{ file: app/sw.js, lines: [37, 41], text: "if (m && req.method === 'DELETE')" }]
    meta: { route: "DELETE /api/comments/{id}" }
    ports:
      - id: in
        dir: in
        items:
          - id: path
            name: path
            type: object
