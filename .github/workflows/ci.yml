name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm は package.json の packageManager で固定)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm validate examples/race-site.graph.json

      # ビューアのスモークテスト（Playwright + Chromium、ヘッドレス。WebGL は SwiftShader）
      - name: Install Playwright Chromium
        run: pnpm --filter @stack-atlas/viewer exec playwright install --with-deps chromium
      - name: Viewer e2e
        run: pnpm --filter @stack-atlas/viewer e2e
      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-e2e
          path: |
            packages/viewer/e2e/__screenshots__/
            packages/viewer/test-results/
          if-no-files-found: ignore
