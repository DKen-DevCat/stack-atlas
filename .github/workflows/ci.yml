name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm は package.json の packageManager で固定)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chromium は viewer の e2e と screenshots 抽出器のテストで使う（両方 Playwright 1.63）
      - name: Install Playwright Chromium
        run: pnpm --filter @stack-atlas/viewer exec playwright install --with-deps chromium

      # go-types（Go の言語アダプタ）は ubuntu の runner に入っている go を使う（actions/setup-go は足さない。docs/17 D48）。
      # helper の go.mod は go 1.21 で、GOTOOLCHAIN=local なので runner の go がそれ以上なら動く。
      # STACK_ATLAS_REQUIRE_GO=1 で go が無いことを失敗にする（Go の側のテストと合流を黙って飛ばさない。D51）
      - name: Go（runner に入っているもの）
        run: go version

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          STACK_ATLAS_REQUIRE_GO: '1'
      - run: pnpm build
        env:
          STACK_ATLAS_REQUIRE_GO: '1'
      - run: pnpm validate examples/race-site.graph.json examples/fixture-poly.today.v2.json

      # フィクスチャ（単一 repo / 2 repo）を実際にビルドして検証する。graph.json は v2（配線図）、
      # graph.v1.json は v1（3D の地図）。validate は version を見て検証器を選ぶ（docs/16 §10）
      - run: pnpm atlas build examples/fixture-repo -o out/fixture-repo --no-screenshots
        env:
          STACK_ATLAS_REQUIRE_GO: '1'
      - run: pnpm atlas build examples/fixture-poly -o out/fixture-poly --no-screenshots
        env:
          STACK_ATLAS_REQUIRE_GO: '1'
      - run: >-
          pnpm validate
          out/fixture-repo/graph.json out/fixture-repo/graph.v1.json
          out/fixture-poly/graph.json out/fixture-poly/graph.v1.json
      - name: Upload graphs
        uses: actions/upload-artifact@v4
        with:
          name: graphs
          path: |
            out/**/graph.json
            out/**/graph.v1.json

      # ビューアのスモークテスト（ヘッドレス。WebGL は SwiftShader）
      - name: Viewer e2e
        run: pnpm --filter @stack-atlas/viewer e2e
      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-e2e
          path: |
            packages/viewer/e2e/__screenshots__/
            packages/viewer/test-results/
          if-no-files-found: ignore
